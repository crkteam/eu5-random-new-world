# eu5-rnw 的 Cargo workspace：所有成員共用一份 Cargo.lock 和 target/。
# 編譯結果：target/release/eu5-rnw.exe
[workspace]
resolver = "3"
members = ["core", "ui"]
# old/ 是原專案，裡面有自己的 Cargo 專案（native/、desktop/src-tauri/）。
exclude = ["old"]

# 生成地圖是大量數值運算，release 版開滿優化。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
